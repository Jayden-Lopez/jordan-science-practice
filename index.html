<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan's Science 6 Practice</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔬</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header .subtitle {
            color: #764ba2;
            font-size: 1.2em;
            font-weight: 500;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 5px 15px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .units-container {
            margin-bottom: 30px;
        }

        .unit-section {
            margin-bottom: 30px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            background: #f9f9f9;
        }

        .unit-header {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .chapter-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            border: 3px solid transparent;
        }

        .chapter-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .chapter-card.locked {
            background: linear-gradient(135deg, #9e9e9e 0%, #616161 100%);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .chapter-card.locked:hover {
            transform: none;
        }

        .chapter-card.mastered {
            border-color: #4CAF50;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }

        .chapter-number {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .chapter-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .chapter-progress {
            font-size: 0.85em;
            opacity: 0.9;
        }

        .lock-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5em;
        }

        .mastery-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            color: #4CAF50;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .practice-screen {
            display: none;
        }

        .practice-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .practice-header h2 {
            margin-bottom: 10px;
        }

        .question-container {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .question-text {
            font-size: 1.3em;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #333;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: white;
            border: 2px solid #e0e0e0;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 1.1em;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .option-btn.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .option-btn.correct {
            border-color: #4CAF50;
            background: #4CAF50;
            color: white;
        }

        .option-btn.incorrect {
            border-color: #f44336;
            background: #f44336;
            color: white;
        }

        .input-answer {
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-top: 10px;
        }

        .input-answer:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            justify-content: center;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-hint {
            background: #FFA726;
            color: white;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .btn-hint:hover {
            background: #FB8C00;
            transform: translateY(-2px);
        }

        .hint-box {
            display: none;
            background: #FFF3E0;
            border-left: 4px solid #FFA726;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
            font-size: 1em;
            color: #333;
        }

        .hint-box.show {
            display: block;
        }

        /* Lesson content styles */
        .question-text h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .question-text h4 {
            color: #333;
            margin-bottom: 10px;
        }

        .question-text ul, .question-text ol {
            margin-left: 20px;
            margin-bottom: 15px;
        }

        .question-text li {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .question-text p {
            margin-bottom: 12px;
            line-height: 1.6;
        }

        .question-text table {
            margin: 15px 0;
        }

        .feedback {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-size: 1.1em;
            display: none;
        }

        .feedback.correct {
            background: #4CAF50;
            color: white;
        }

        .feedback.incorrect {
            background: #f44336;
            color: white;
        }

        .parent-dashboard {
            display: none;
            background: #f9f9f9;
            padding: 30px;
            border-radius: 15px;
        }

        .pin-screen {
            text-align: center;
            padding: 50px;
        }

        .pin-input {
            width: 200px;
            padding: 15px;
            font-size: 1.5em;
            text-align: center;
            border: 2px solid #667eea;
            border-radius: 10px;
            margin: 20px auto;
            display: block;
        }

        .progress-chart {
            margin-top: 30px;
        }

        .chapter-progress-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .progress-bar {
            width: 60%;
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .nav-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .chapters-grid {
                grid-template-columns: 1fr;
            }
            
            .stat-item {
                flex: 1 1 45%;
            }
            
            .nav-buttons {
                position: static;
                justify-content: center;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="nav-buttons">
        <button class="nav-btn" onclick="showParentDashboard()">📊 Parent Dashboard</button>
    </div>

    <div class="container">
        <!-- Main Menu Screen -->
        <div id="mainMenu">
            <div class="header">
                <h1>🔬 Jordan's Science 6 Practice</h1>
                <div class="subtitle">BJU Press Science Grade 6 - Fourth Edition</div>
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-value" id="totalCorrect">0</span>
                    <span class="stat-label">Total Correct</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="totalQuestions">0</span>
                    <span class="stat-label">Questions Answered</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="accuracy">0%</span>
                    <span class="stat-label">Overall Accuracy</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="chaptersCompleted">0</span>
                    <span class="stat-label">Chapters Mastered</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="currentStreak">0</span>
                    <span class="stat-label">Day Streak 🔥</span>
                </div>
            </div>

            <div class="units-container" id="unitsContainer">
                <!-- Units and chapters will be generated here -->
            </div>
        </div>

        <!-- Practice Screen -->
        <div id="practiceScreen" class="practice-screen">
            <div class="practice-header">
                <h2 id="practiceChapterTitle"></h2>
                <div id="practiceProgress"></div>
            </div>

            <div class="question-container">
                <div class="question-number" id="questionNumber"></div>
                <div class="question-text" id="questionText"></div>
                <div id="answerArea"></div>
                <div class="feedback" id="feedback"></div>
            </div>

            <div class="button-container">
                <button class="btn btn-secondary" onclick="exitPractice()">Exit to Menu</button>
                <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">Submit Answer</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Next Question</button>
            </div>
        </div>

        <!-- Parent Dashboard -->
        <div id="parentDashboard" class="parent-dashboard">
            <div id="pinScreen" class="pin-screen">
                <h2>Parent Dashboard Access</h2>
                <p>Enter PIN to view detailed progress</p>
                <input type="password" class="pin-input" id="pinInput" placeholder="Enter PIN" maxlength="4">
                <button class="btn btn-primary" onclick="verifyPin()">Unlock Dashboard</button>
                <button class="btn btn-secondary" onclick="closeParentDashboard()">Cancel</button>
            </div>

            <div id="dashboardContent" style="display:none;">
                <h2>📊 Jordan's Science Progress Dashboard</h2>
                <button class="btn btn-secondary" onclick="closeParentDashboard()" style="float:right;">Close</button>
                <div class="progress-chart" id="progressChart"></div>
                
                <div style="margin-top: 30px;">
                    <h3>Settings</h3>
                    <button class="btn btn-secondary" onclick="resetProgress()">Reset All Progress</button>
                    <button class="btn btn-secondary" onclick="changePin()">Change PIN</button>
                </div>
            </div>
        </div>
    </div>

                        "Heart",
                        "Liver",
                        "Spleen",
                        "Stomach"
                    ],
                    correct: 2
                }
            ]
        };

        // State Management
        let currentChapter = null;
        let currentQuestionIndex = 0;
        let currentQuestions = [];
        let sessionStats = {
            correct: 0,
            total: 0
        };
        let userProgress = {};
        let parentSettings = {
            pinHash: hashPin("1234") // Default PIN: 1234
        };

        // Simple hash function for PIN
        function hashPin(pin) {
            let hash = 0;
            for (let i = 0; i < pin.length; i++) {
                hash = ((hash << 5) - hash) + pin.charCodeAt(i);
                hash = hash & hash;
            }
            return Math.abs(hash).toString();
        }

        // Initialize app
        function init() {
            loadProgress();
            loadParentSettings();
            renderUnits();
            updateStats();
            checkDailyStreak();
        }

        // Load progress from Firebase
        function loadProgress() {
            const userDoc = doc(firestore, 'science-users', 'jordan');
            getDoc(userDoc).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    if (data.progress) {
                        userProgress = data.progress;
                    } else {
                        // Initialize progress for all chapters
                        for (let i = 1; i <= 15; i++) {
                            userProgress[i] = {
                                correct: 0,
                                total: 0,
                                accuracy: 0,
                                mastered: false
                            };
                        }
                        saveProgress();
                    }
                } else {
                    // Initialize progress for all chapters
                    for (let i = 1; i <= 15; i++) {
                        userProgress[i] = {
                            correct: 0,
                            total: 0,
                            accuracy: 0,
                            mastered: false
                        };
                    }
                    saveProgress();
                }
                renderUnits();
                updateStats();
            }).catch((error) => {
                console.error('Error loading progress:', error);
            });
        }

        // Save progress to Firebase
        function saveProgress() {
            const userDoc = doc(firestore, 'science-users', 'jordan');
            updateDoc(userDoc, {
                progress: userProgress
            }).catch((error) => {
                // If document doesn't exist, create it
                if (error.code === 'not-found') {
                    setDoc(userDoc, {
                        progress: userProgress,
                        streak: 0,
                        lastVisit: new Date().toDateString()
                    });
                } else {
                    console.error('Error saving progress:', error);
                }
            });
        }

        // Load parent settings
        function loadParentSettings() {
            const settingsDoc = doc(firestore, 'science-settings', 'parent');
            getDoc(settingsDoc).then((snapshot) => {
                if (snapshot.exists()) {
                    parentSettings = snapshot.data();
                } else {
                    setDoc(settingsDoc, parentSettings);
                }
            }).catch((error) => {
                console.error('Error loading parent settings:', error);
            });
        }

        // Check daily streak
        function checkDailyStreak() {
            const today = new Date().toDateString();
            const userDoc = doc(firestore, 'science-users', 'jordan');

            getDoc(userDoc).then((snapshot) => {
                const data = snapshot.exists() ? snapshot.data() : {};
                const lastVisit = data.lastVisit;
                const currentStreak = data.streak || 0;

                if (lastVisit !== today) {
                    let newStreak = 1;

                    if (lastVisit) {
                        const yesterday = new Date();
                        yesterday.setDate(yesterday.getDate() - 1);

                        if (lastVisit === yesterday.toDateString()) {
                            newStreak = currentStreak + 1;
                        }
                    }

                    // Update lastVisit and streak
                    if (snapshot.exists()) {
                        updateDoc(userDoc, {
                            lastVisit: today,
                            streak: newStreak
                        });
                    } else {
                        setDoc(userDoc, {
                            lastVisit: today,
                            streak: newStreak,
                            progress: {}
                        });
                    }
                }
            }).catch((error) => {
                console.error('Error checking daily streak:', error);
            });
        }

        // Render units and chapters
        function renderUnits() {
            const container = document.getElementById('unitsContainer');
            container.innerHTML = '';

            Object.keys(curriculum).forEach(unitName => {
                const unitSection = document.createElement('div');
                unitSection.className = 'unit-section';

                const unitHeader = document.createElement('div');
                unitHeader.className = 'unit-header';
                unitHeader.textContent = unitName;
                unitSection.appendChild(unitHeader);

                const chaptersGrid = document.createElement('div');
                chaptersGrid.className = 'chapters-grid';

                curriculum[unitName].forEach(chapter => {
                    const card = createChapterCard(chapter);
                    chaptersGrid.appendChild(card);
                });

                unitSection.appendChild(chaptersGrid);
                container.appendChild(unitSection);
            });
        }

        // Create chapter card
        function createChapterCard(chapter) {
            const card = document.createElement('div');
            const progress = userProgress[chapter.id] || { correct: 0, total: 0, accuracy: 0, mastered: false };
            const isLocked = false; // UNLOCKED - Jordan can access any chapter

            card.className = 'chapter-card';
            if (isLocked) card.classList.add('locked');
            if (progress.mastered) card.classList.add('mastered');

            card.innerHTML = `
                <div class="chapter-number">Chapter ${chapter.id}</div>
                <div class="chapter-title">${chapter.title}</div>
                <div class="chapter-progress">
                    ${progress.total > 0 ? `${progress.correct}/${progress.total} correct (${Math.round(progress.accuracy)}%)` : 'Not started'}
                </div>
                ${isLocked ? '<div class="lock-icon">🔒</div>' : ''}
                ${progress.mastered ? '<div class="mastery-badge">✓ Mastered</div>' : ''}
                <div style="margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="practice-btn" style="flex: 1; min-width: 100px; padding: 8px; background: white; border: 2px solid white; border-radius: 5px; cursor: pointer; font-weight: bold;">Practice</button>
                    <button class="test-btn" style="flex: 1; min-width: 100px; padding: 8px; background: #FF6B6B; color: white; border: 2px solid #FF6B6B; border-radius: 5px; cursor: pointer; font-weight: bold;">📝 Test</button>
                </div>
            `;

            // Practice mode
            card.querySelector('.practice-btn').onclick = (e) => {
                e.stopPropagation();
                startChapter(chapter.id, false);
            };

            // Test mode
            card.querySelector('.test-btn').onclick = (e) => {
                e.stopPropagation();
                startChapter(chapter.id, true);
            };

            return card;
        }

        // State for lesson-based chapters
        let currentSectionIndex = 0;
        let currentSectionQuestionIndex = 0;
        let isShowingLesson = false;
        let chapterHasLessons = false;

        // Start chapter practice
        function startChapter(chapterId, isTestMode = false) {
            currentChapter = chapterId;
            const chapterData = questionBank[chapterId];

            // Check if this chapter has lessons (new format) or is just questions (old format)
            if (chapterData && chapterData.hasLessons) {
                chapterHasLessons = true;
                currentSectionIndex = 0;
                currentSectionQuestionIndex = 0;

                if (isTestMode) {
                    // Test mode: extract all questions, shuffle them
                    currentQuestions = [];
                    chapterData.sections.forEach(section => {
                        currentQuestions.push(...section.questions);
                    });
                    currentQuestions.sort(() => Math.random() - 0.5);
                    isShowingLesson = false;
                } else {
                    // Practice mode: go through lessons then questions in order
                    isShowingLesson = true;
                }
            } else {
                // Old format - just an array of questions
                chapterHasLessons = false;
                currentQuestions = [...chapterData].sort(() => Math.random() - 0.5);
                isShowingLesson = false;
            }

            currentQuestionIndex = 0;
            sessionStats = { correct: 0, total: 0, isTestMode: isTestMode, answers: [] };

            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('practiceScreen').style.display = 'block';

            // Find chapter name
            let chapterName = '';
            Object.values(curriculum).forEach(unit => {
                const chapter = unit.find(ch => ch.id === chapterId);
                if (chapter) chapterName = chapter.title;
            });

            const modeText = isTestMode ? ' - 📝 TEST MODE (No feedback until end!)' : ' - 📖 Study Mode';
            document.getElementById('practiceChapterTitle').textContent = `Chapter ${chapterId}: ${chapterName}${modeText}`;

            if (chapterHasLessons && !isTestMode) {
                showLesson();
            } else {
                showQuestion();
            }
        }

        // Show lesson content for study mode
        function showLesson() {
            const chapterData = questionBank[currentChapter];
            const section = chapterData.sections[currentSectionIndex];

            document.getElementById('questionNumber').textContent = `Section ${currentSectionIndex + 1} of ${chapterData.sections.length}: ${section.title}`;
            document.getElementById('practiceProgress').textContent = `Progress: ${sessionStats.correct}/${sessionStats.total} correct`;

            // Show lesson content instead of question
            document.getElementById('questionText').innerHTML = section.lesson;

            const answerArea = document.getElementById('answerArea');
            answerArea.innerHTML = `
                <div style="text-align: center; margin-top: 20px;">
                    <p style="color: #667eea; font-weight: bold; margin-bottom: 15px;">
                        📚 Read the lesson above, then click "Start Questions" when you're ready!
                    </p>
                </div>
            `;

            document.getElementById('feedback').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').textContent = '▶️ Start Questions';
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').onclick = () => {
                isShowingLesson = false;
                currentSectionQuestionIndex = 0;
                document.getElementById('nextBtn').textContent = 'Next Question';
                document.getElementById('nextBtn').onclick = nextQuestion;
                showQuestion();
            };
        }

        // Show current question
        function showQuestion() {
            let question;
            let totalQuestions;
            let questionNum;

            // Handle lesson-based chapters in practice mode
            if (chapterHasLessons && !sessionStats.isTestMode) {
                const chapterData = questionBank[currentChapter];
                const section = chapterData.sections[currentSectionIndex];

                // Check if we've finished this section's questions
                if (currentSectionQuestionIndex >= section.questions.length) {
                    // Move to next section
                    currentSectionIndex++;
                    currentSectionQuestionIndex = 0;

                    // Check if we've finished all sections
                    if (currentSectionIndex >= chapterData.sections.length) {
                        finishChapter();
                        return;
                    }

                    // Show next lesson
                    isShowingLesson = true;
                    showLesson();
                    return;
                }

                question = section.questions[currentSectionQuestionIndex];
                questionNum = currentSectionQuestionIndex + 1;
                totalQuestions = section.questions.length;

                document.getElementById('questionNumber').textContent = `${section.title} - Question ${questionNum} of ${totalQuestions}`;
            } else {
                // Test mode or old format - use currentQuestions array
                if (currentQuestionIndex >= currentQuestions.length) {
                    finishChapter();
                    return;
                }

                question = currentQuestions[currentQuestionIndex];
                questionNum = currentQuestionIndex + 1;
                totalQuestions = currentQuestions.length;

                document.getElementById('questionNumber').textContent = `Question ${questionNum} of ${totalQuestions}`;
            }

            document.getElementById('practiceProgress').textContent = `Progress: ${sessionStats.correct}/${sessionStats.total} correct`;
            document.getElementById('questionText').textContent = question.question;
            
            const answerArea = document.getElementById('answerArea');
            answerArea.innerHTML = '';

            if (question.type === 'multiple') {
                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'options-container';
                question.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    btn.onclick = () => selectOption(index);
                    optionsContainer.appendChild(btn);
                });
                answerArea.appendChild(optionsContainer);
            } else if (question.type === 'truefalse') {
                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'options-container';
                ['True', 'False'].forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    btn.onclick = () => selectOption(index === 0);
                    optionsContainer.appendChild(btn);
                });
                answerArea.appendChild(optionsContainer);
            } else if (question.type === 'fillin') {
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'input-answer';
                input.id = 'fillInAnswer';
                input.placeholder = 'Type your answer here...';
                answerArea.appendChild(input);
            }

            // Add hint button and hint box (only in practice mode)
            if (!sessionStats.isTestMode && question.hint) {
                const hintBtn = document.createElement('button');
                hintBtn.className = 'btn-hint';
                hintBtn.textContent = '💡 Need a Hint?';
                hintBtn.onclick = () => {
                    const hintBox = document.getElementById('hintBox');
                    hintBox.classList.toggle('show');
                };
                answerArea.appendChild(hintBtn);

                const hintBox = document.createElement('div');
                hintBox.id = 'hintBox';
                hintBox.className = 'hint-box';
                hintBox.innerHTML = `<strong>💡 Hint:</strong> ${question.hint}`;
                answerArea.appendChild(hintBox);
            }

            document.getElementById('feedback').style.display = 'none';
            document.getElementById('submitBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
        }

        let selectedAnswer = null;

        function selectOption(index) {
            selectedAnswer = index;
            document.querySelectorAll('.option-btn').forEach((btn, i) => {
                btn.classList.remove('selected');
                if (i === index) btn.classList.add('selected');
            });
        }

        function submitAnswer() {
            // Get the current question based on mode
            let question;
            if (chapterHasLessons && !sessionStats.isTestMode) {
                const chapterData = questionBank[currentChapter];
                const section = chapterData.sections[currentSectionIndex];
                question = section.questions[currentSectionQuestionIndex];
            } else {
                question = currentQuestions[currentQuestionIndex];
            }

            let isCorrect = false;
            let userAnswer = null;

            if (question.type === 'multiple' || question.type === 'truefalse') {
                if (selectedAnswer === null) {
                    alert('Please select an answer!');
                    return;
                }
                userAnswer = selectedAnswer;
                isCorrect = selectedAnswer === question.correct;
            } else if (question.type === 'fillin') {
                userAnswer = document.getElementById('fillInAnswer').value.trim().toLowerCase();
                if (!userAnswer) {
                    alert('Please enter an answer!');
                    return;
                }
                isCorrect = userAnswer === question.correct.toLowerCase();
            }

            sessionStats.total++;
            if (isCorrect) sessionStats.correct++;
            
            // Store answer for test mode review
            sessionStats.answers.push({
                question: question.question,
                userAnswer: userAnswer,
                correctAnswer: question.correct,
                isCorrect: isCorrect,
                options: question.options
            });

            // TEST MODE: No immediate feedback
            if (sessionStats.isTestMode) {
                document.getElementById('feedback').style.display = 'none';
                document.getElementById('submitBtn').style.display = 'none';
                document.getElementById('nextBtn').style.display = 'inline-block';
                selectedAnswer = null;
                return;
            }

            // PRACTICE MODE: Show feedback immediately
            const feedback = document.getElementById('feedback');
            feedback.style.display = 'block';
            feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
            
            if (isCorrect) {
                feedback.textContent = '✓ Correct! Great job!';
            } else {
                if (question.type === 'multiple') {
                    feedback.textContent = `✗ Not quite. The correct answer is: ${question.options[question.correct]}`;
                } else if (question.type === 'truefalse') {
                    feedback.textContent = `✗ Not quite. The correct answer is: ${question.correct ? 'True' : 'False'}`;
                } else {
                    feedback.textContent = `✗ Not quite. The correct answer is: ${question.correct}`;
                }
            }

            // Visual feedback on options (Practice mode only)
            if (question.type === 'multiple' || question.type === 'truefalse') {
                document.querySelectorAll('.option-btn').forEach((btn, i) => {
                    btn.onclick = null;
                    if (i === question.correct) {
                        btn.classList.add('correct');
                    } else if (i === selectedAnswer && !isCorrect) {
                        btn.classList.add('incorrect');
                    }
                });
            }

            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'inline-block';
            selectedAnswer = null;
        }

        function nextQuestion() {
            // Handle lesson-based chapters in practice mode
            if (chapterHasLessons && !sessionStats.isTestMode) {
                currentSectionQuestionIndex++;
            } else {
                currentQuestionIndex++;
            }
            showQuestion();
        }

        function finishChapter() {
            // Update progress (only in practice mode)
            if (!sessionStats.isTestMode) {
                if (!userProgress[currentChapter]) {
                    userProgress[currentChapter] = { correct: 0, total: 0, accuracy: 0, mastered: false };
                }

                userProgress[currentChapter].correct += sessionStats.correct;
                userProgress[currentChapter].total += sessionStats.total;
                userProgress[currentChapter].accuracy = (userProgress[currentChapter].correct / userProgress[currentChapter].total) * 100;

                // Check for mastery (80% accuracy and at least 5 questions)
                if (userProgress[currentChapter].accuracy >= 80 && userProgress[currentChapter].total >= 5) {
                    userProgress[currentChapter].mastered = true;
                }

                saveProgress();
            }

            const accuracy = Math.round((sessionStats.correct / sessionStats.total) * 100);
            
            // TEST MODE: Show detailed results
            if (sessionStats.isTestMode) {
                let resultsHTML = `<div style="max-height: 400px; overflow-y: auto; text-align: left;">`;
                resultsHTML += `<h2>📝 Test Results</h2>`;
                resultsHTML += `<p><strong>Score: ${sessionStats.correct}/${sessionStats.total} (${accuracy}%)</strong></p><br>`;
                
                sessionStats.answers.forEach((answer, index) => {
                    const icon = answer.isCorrect ? '✓' : '✗';
                    const color = answer.isCorrect ? 'green' : 'red';
                    resultsHTML += `<div style="margin-bottom: 15px; padding: 10px; border-left: 4px solid ${color};">`;
                    resultsHTML += `<strong>${icon} Question ${index + 1}:</strong> ${answer.question}<br>`;
                    
                    if (!answer.isCorrect) {
                        if (answer.options) {
                            resultsHTML += `<span style="color: red;">Your answer: ${answer.options[answer.userAnswer]}</span><br>`;
                            resultsHTML += `<span style="color: green;">Correct: ${answer.options[answer.correctAnswer]}</span>`;
                        } else {
                            resultsHTML += `<span style="color: red;">Your answer: ${answer.userAnswer}</span><br>`;
                            resultsHTML += `<span style="color: green;">Correct: ${answer.correctAnswer}</span>`;
                        }
                    }
                    resultsHTML += `</div>`;
                });
                resultsHTML += `</div>`;
                
                // Create a modal-style display
                const modal = document.createElement('div');
                modal.style.cssText = 'position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 10000;';
                modal.innerHTML = `
                    <div style="background: white; padding: 30px; border-radius: 15px; max-width: 600px; max-height: 80vh; overflow-y: auto;">
                        ${resultsHTML}
                        <button onclick="this.parentElement.parentElement.remove(); exitPractice();" style="margin-top: 20px; padding: 15px 30px; background: #667eea; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 16px; font-weight: bold;">Close & Return to Menu</button>
                    </div>
                `;
                document.body.appendChild(modal);
            } else {
                // PRACTICE MODE: Simple alert
                const message = `Chapter Complete!\n\nYou got ${sessionStats.correct} out of ${sessionStats.total} correct (${accuracy}%)\n\n${
                    userProgress[currentChapter].mastered ? '🎉 Chapter Mastered!' : 'Keep practicing to master this chapter!'
                }`;
                alert(message);
                exitPractice();
            }
        }

        function exitPractice() {
            document.getElementById('practiceScreen').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
            renderUnits();
            updateStats();
        }

        function updateStats() {
            let totalCorrect = 0;
            let totalQuestions = 0;
            let chaptersCompleted = 0;

            Object.values(userProgress).forEach(progress => {
                totalCorrect += progress.correct || 0;
                totalQuestions += progress.total || 0;
                if (progress.mastered) chaptersCompleted++;
            });

            document.getElementById('totalCorrect').textContent = totalCorrect;
            document.getElementById('totalQuestions').textContent = totalQuestions;
            document.getElementById('accuracy').textContent = totalQuestions > 0 ?
                Math.round((totalCorrect / totalQuestions) * 100) + '%' : '0%';
            document.getElementById('chaptersCompleted').textContent = chaptersCompleted;

            // Update streak from Firestore
            const userDoc = doc(firestore, 'science-users', 'jordan');
            getDoc(userDoc).then((snapshot) => {
                const data = snapshot.exists() ? snapshot.data() : {};
                document.getElementById('currentStreak').textContent = data.streak || 0;
            }).catch((error) => {
                console.error('Error loading streak:', error);
                document.getElementById('currentStreak').textContent = 0;
            });
        }

        // Parent Dashboard Functions
        function showParentDashboard() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('practiceScreen').style.display = 'none';
            document.getElementById('parentDashboard').style.display = 'block';
            document.getElementById('pinScreen').style.display = 'block';
            document.getElementById('dashboardContent').style.display = 'none';
            document.getElementById('pinInput').value = '';
        }

        function verifyPin() {
            const enteredPin = document.getElementById('pinInput').value;
            if (hashPin(enteredPin) === parentSettings.pinHash) {
                document.getElementById('pinScreen').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';
                renderProgressChart();
            } else {
                alert('Incorrect PIN. Please try again.');
                document.getElementById('pinInput').value = '';
            }
        }

        function closeParentDashboard() {
            document.getElementById('parentDashboard').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'block';
        }

        function renderProgressChart() {
            const chartContainer = document.getElementById('progressChart');
            chartContainer.innerHTML = '<h3>Chapter Progress</h3>';

            for (let i = 1; i <= 15; i++) {
                const progress = userProgress[i] || { correct: 0, total: 0, accuracy: 0, mastered: false };
                const item = document.createElement('div');
                item.className = 'chapter-progress-item';
                
                let chapterName = '';
                Object.values(curriculum).forEach(unit => {
                    const chapter = unit.find(ch => ch.id === i);
                    if (chapter) chapterName = chapter.title;
                });

                item.innerHTML = `
                    <div style="flex: 1;">
                        <strong>Ch ${i}: ${chapterName}</strong><br>
                        ${progress.total > 0 ? `${progress.correct}/${progress.total} (${Math.round(progress.accuracy)}%)` : 'Not started'}
                        ${progress.mastered ? ' ✓ Mastered' : ''}
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${Math.min(progress.accuracy, 100)}%"></div>
                    </div>
                `;
                chartContainer.appendChild(item);
            }
        }

        function resetProgress() {
            if (confirm('Are you sure you want to reset ALL progress? This cannot be undone.')) {
                if (confirm('This will delete all of Jordan\'s progress. Are you REALLY sure?')) {
                    userProgress = {};
                    for (let i = 1; i <= 15; i++) {
                        userProgress[i] = {
                            correct: 0,
                            total: 0,
                            accuracy: 0,
                            mastered: false
                        };
                    }

                    const userDoc = doc(firestore, 'science-users', 'jordan');
                    setDoc(userDoc, {
                        progress: userProgress,
                        streak: 0,
                        lastVisit: new Date().toDateString()
                    });

                    alert('All progress has been reset.');
                    closeParentDashboard();
                    renderUnits();
                    updateStats();
                }
            }
        }

        function changePin() {
            const newPin = prompt('Enter new 4-digit PIN:');
            if (newPin && newPin.length === 4 && !isNaN(newPin)) {
                parentSettings.pinHash = hashPin(newPin);
                const settingsDoc = doc(firestore, 'science-settings', 'parent');
                setDoc(settingsDoc, parentSettings);
                alert('PIN changed successfully!');
            } else {
                alert('Invalid PIN. Must be 4 digits.');
            }
        }

        // Note: init() is called from waitForFirebase() after Firebase loads
    </script>
</body>
</html>
